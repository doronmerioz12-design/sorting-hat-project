<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Where do they belong?</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="selection-screen" class="split-container">
		<div class="split left" onclick="selectUniverse('Hogwarts')">
			<h2>Hogwarts</h2>
			<div class="glow-symbol">
				<img src="assets/hogwarts_logo.png" alt="Hogwarts Logo" class="side-logo">
			</div>
		</div>
		<div class="split right" onclick="selectUniverse('Avatar')">
			<h2>Avatar</h2>
			<div class="glow-symbol">
				<img src="assets/avatar_logo.png" alt="Avatar Logo" class="side-logo">
			</div>
		</div>
	</div>
	
	<div id="sorting-ui" class="overlay" style="display:none;">
		<form class="modal" onsubmit="event.preventDefault(); runSorting();">
			<h1 class="input-instruction">choose the name</h1>
			<h2 id="ui-title"></h2>
			
			<div id="input-section">
				<input type="text" id="nameInput" placeholder="enter a name: ">
				<button type="submit">sorts</button>
			</div>
			
			<div id="result-section" style="display:none;">
				<p id="result-text" dir="ltr" style="font-size: 1.8rem; font-weight: bold; margin: 20px 0;"></p>
				<p id="reason-text" dir="ltr" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; max-width: 80%; margin-left: auto; margin-right: auto;"></p>
				<button type="button" class="refresh-btn" onclick="resetUI()">&#8634;</button>
			</div>
		</form>
	</div>
	
	<div id="loading-section" style="display:none;">
		<div id="houses-loader-container" class="houses-loader">
			<div class="house-part part-1"></div>
			<div class="house-part part-2"></div>
			<div class="house-part part-3"></div>
			<div class="house-part part-4"></div>
		</div>
	</div>
	
	<script src="script.js"></script>
</body>
</html>
